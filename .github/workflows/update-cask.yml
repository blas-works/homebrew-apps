name: Update Cask

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application name (hollow, infinito, or mira)"
        required: true
        type: choice
        options:
          - hollow
          - infinito
          - mira
      version:
        description: "New version (without v prefix, e.g. 3.8.0)"
        required: true
        type: string
  repository_dispatch:
    types: [update-cask]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            APP="${{ github.event.client_payload.app }}"
            VERSION="${{ github.event.client_payload.version }}"
          else
            APP="${{ inputs.app }}"
            VERSION="${{ inputs.version }}"
          fi

          echo "app=${APP}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download and compute SHA256
        id: sha
        run: |
          APP="${{ steps.inputs.outputs.app }}"
          VERSION="${{ steps.inputs.outputs.version }}"

          ARM64_URL="https://github.com/blas-works/${APP}/releases/download/v${VERSION}/${APP}-${VERSION}-arm64.dmg"
          X64_URL="https://github.com/blas-works/${APP}/releases/download/v${VERSION}/${APP}-${VERSION}-x64.dmg"

          echo "Downloading arm64 DMG from ${ARM64_URL}..."
          curl -fSL -o arm64.dmg "${ARM64_URL}"
          ARM64_SHA=$(shasum -a 256 arm64.dmg | awk '{print $1}')
          echo "arm64_sha=${ARM64_SHA}" >> "$GITHUB_OUTPUT"

          echo "Downloading x64 DMG from ${X64_URL}..."
          curl -fSL -o x64.dmg "${X64_URL}"
          X64_SHA=$(shasum -a 256 x64.dmg | awk '{print $1}')
          echo "x64_sha=${X64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Update Cask file
        run: |
          APP="${{ steps.inputs.outputs.app }}"
          VERSION="${{ steps.inputs.outputs.version }}"
          CASK_FILE="Casks/${APP}.rb"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"

          # Update ARM64 SHA256 (first sha256 occurrence)
          sed -i "0,/sha256 \".*\"/{s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.arm64_sha }}\"/}" "$CASK_FILE"

          # Update x64 SHA256 (second sha256 occurrence)
          sed -i "0,/sha256 \".*\"/! {0,/sha256 \".*\"/ s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.x64_sha }}\"/}" "$CASK_FILE"

          cat "$CASK_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${{ steps.inputs.outputs.app }}.rb"
          git commit -m "bump ${{ steps.inputs.outputs.app }} to ${{ steps.inputs.outputs.version }}"
          git push
